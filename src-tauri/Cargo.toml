[package]
name = "iodum"
authors = ["shieber"]
version = "0.1.0"
edition = "2021"

[lib]
name = "iodum_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3.7"
sha2 = "0.10"
anyhow = "1.0.104"
